app-id: com.anycubic.AnycubicSlicer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: anycubic-slicer-wrapper
# One branch for every version. The Flatpak remote only updates an install
# within its own branch, so a branch per version would leave everyone on the
# version they first installed.
branch: stable

finish-args:
  # Display and IPC. X11 only: the binary forces GDK_BACKEND=x11 itself, so
  # it runs through XWayland on Wayland desktops.
  - --share=ipc
  - --socket=x11

  # Audio access (for notifications/sounds)
  - --socket=pulseaudio

  # Network access for printer connectivity and cloud features
  - --share=network

  # OpenGL, camera, and device access
  - --device=all

  # File access for loading/saving models
  - --filesystem=home

  # GVFS access (GnomeVFS support)
  - --filesystem=xdg-run/gvfs

  # Removable media access (USB drives, SD cards)
  - --filesystem=/run/media
  - --filesystem=/media

modules:
  - name: anycubic-slicer
    buildsystem: simple
    build-options:
      # Anycubic ships a stripped binary: there is no debug info to split off,
      # and without this flatpak-builder would still publish an empty .Debug
      # extension next to the app.
      no-debuginfo: true
    build-commands:
      # Extract the deb package (tar picks the compression from the file)
      - ar x anycubicslicernext.deb
      - tar xf data.tar.*

      # Install files to flatpak prefix
      - cp -r usr/* /app/

      # Since 2.0.0.5 the deb also ships build leftovers that are not used at runtime
      - rm -rf /app/include /app/lib/cmake /app/lib/*.a

      # Copy resources to expected location
      - mkdir -p /app/share/AnycubicSlicerNext
      - cp -r /app/share/AnycubicSlicerNext/resources /app/resources

      # Register the bundled UI fonts with fontconfig (/app/share/fonts is on the
      # runtime's font path). The app also loads them itself with
      # wxFont::AddPrivateFont(); on its own that makes pango before 1.57.1
      # segfault whenever NanumGothic is needed (issue #4).
      - mkdir -p /app/share/fonts
      - cp /app/resources/fonts/*.ttf /app/share/fonts/ || true

      # Create wrapper script (modeled after OrcaSlicer's entrypoint)
      - |
        cat > /app/bin/anycubic-slicer-wrapper <<'WRAPPER'
        #!/usr/bin/env sh

        # WebKit's DMA-BUF renderer sets up a GL context of its own inside the
        # app's process, and the slicer's own GL state does not survive that:
        # web windows opened after start-up, such as the login window, come up
        # black. OrcaSlicer, which this app derives from, fixed it in their
        # source; here the binary is Anycubic's, so turn the renderer off.
        # Set it to 0 yourself to get it back.
        export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"

        # Locale fix to prevent segfaults on systems with non-standard locales
        export LC_ALL=C.UTF-8

        # Library path for bundled application libraries
        export LD_LIBRARY_PATH="/app/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

        cd /app || exit 1
        exec /app/bin/AnycubicSlicerNext "$@"
        WRAPPER
      - chmod +x /app/bin/anycubic-slicer-wrapper

      # Install desktop file and icons. Software centers need the scalable icon:
      # appstream compose only looks for 64, 128, 256 or scalable, not 192.
      - install -Dm644 /app/share/applications/AnycubicSlicer.desktop /app/share/applications/com.anycubic.AnycubicSlicer.desktop
      - sed -i 's/Icon=.*/Icon=com.anycubic.AnycubicSlicer/' /app/share/applications/com.anycubic.AnycubicSlicer.desktop
      - sed -i 's/Exec=.*/Exec=anycubic-slicer-wrapper %U/' /app/share/applications/com.anycubic.AnycubicSlicer.desktop
      - install -Dm644 /app/share/AnycubicSlicerNext/resources/images/AnycubicSlicer_192px.png /app/share/icons/hicolor/192x192/apps/com.anycubic.AnycubicSlicer.png
      - install -Dm644 /app/share/AnycubicSlicerNext/resources/images/AnycubicSlicer.svg /app/share/icons/hicolor/scalable/apps/com.anycubic.AnycubicSlicer.svg

      # AppStream metadata, stamped with the version and build date of this deb.
      # build-version.txt holds the real app version (the deb's own version
      # number is a different scheme), build-timestamp.txt is YYYYMMDDhhmmss.
      - |
        version=$(cat /app/resources/build-version.txt)
        date=$(sed 's/^\(....\)\(..\)\(..\).*/\1-\2-\3/' /app/resources/build-timestamp.txt)
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$date/" com.anycubic.AnycubicSlicer.metainfo.xml > metainfo.xml
        install -Dm644 metainfo.xml /app/share/metainfo/com.anycubic.AnycubicSlicer.metainfo.xml

    sources:
      - type: file
        path: anycubicslicernext.deb
      - type: file
        path: com.anycubic.AnycubicSlicer.metainfo.xml
